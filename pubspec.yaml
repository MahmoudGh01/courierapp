name: courier_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_phoenix: ^1.0.0
  flutter_xlider:
    git:
      url: https://github.com/Ali-Azmoud/flutter_xlider.git
  flutter_bloc: ^8.0.1
  animation_wrappers: ^3.0.0
  google_maps_flutter: ^2.5.0
  geolocator:
  geocoding: ^2.1.1
  flutter_polyline_points:
  equatable: ^2.0.3
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  flutter_svg:
  get:
  http:
  provider: ^6.1.3
  file_picker: ^10.3.2
  google_places_flutter: ^2.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/appIcon.png"
  min_sdk_android: 20






flutter:

  uses-material-design: true

  assets:
    - images/
    - images/bottom_menu/

  fonts:
    - family: ProductSans
      fonts:
        - asset: fonts/ProductSans-Bold.ttf
        - asset: fonts/ProductSans-Regular.ttf